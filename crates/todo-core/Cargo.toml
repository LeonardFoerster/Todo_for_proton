[package]
name = "todo-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Domain, Use-Cases und Ports (Interfaces). Kein IO."

[dependencies]
async-trait.workspace = true
# Nur für `testing` (Feature test-support): synchrone Ausführung der Contract-Tests.
futures = { workspace = true, optional = true }
chrono.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true

[features]
# Test-Doubles (z. B. `FixedClock`, `SteppingClock`) für Tests anderer Crates.
test-support = ["dep:futures"]

[lints]
workspace = true

[dev-dependencies]
futures.workspace = true
serde_json.workspace = true

# proptest (rusty-fork/wait-timeout) baut nicht für wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true
