[package]
name = "todo-core"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Domain, Use-Cases und Ports (Interfaces). Kein IO."

[dependencies]
async-trait.workspace = true
# `lock::Mutex` (Reihenfolge-Sperre der Use-Cases, FIX-10); `executor` für die Contract-Tests.
futures.workspace = true
chrono.workspace = true
# Kanonisches Binärformat der Sync-Ops (Outbox, Segmente, Snapshots), ADR-016.
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
uuid.workspace = true

[features]
# Test-Doubles (z. B. `FixedClock`, `SteppingClock`) für Tests anderer Crates.
test-support = []

[lints]
workspace = true

[dev-dependencies]
futures.workspace = true
serde_json.workspace = true
# TS-Typen der DTOs für `packages/core-client` (nur in Tests erzeugt, kein Laufzeit-Code).
ts-rs = "12.0.1"

# proptest (rusty-fork/wait-timeout) baut nicht für wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest.workspace = true

[[test]]
name = "api"
required-features = ["test-support"]
