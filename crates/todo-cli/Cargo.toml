[package]
name = "todo-cli"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Entwickler-CLI: Core + SQLite ohne UI benutzen (nicht Teil der App-Auslieferung)."

[dependencies]
todo-core.workspace = true
todo-storage-sqlite.workspace = true
# `sync`: Engine + lokales Verzeichnis als Backend + Cipher (die CLI ist hier Composition Root).
todo-sync = { workspace = true, features = ["zstd-native"] }
todo-remote-fs.workspace = true
todo-crypto.workspace = true
async-trait.workspace = true
# `sync --remote proton`, `login`, `logout`: Proton-Adapter + System-Schlüsselbund. Beide brauchen
# tokio (reqwest/zbus); die CLI läuft deshalb auf einer Single-Thread-Runtime.
proton-adapter.workspace = true
tokio = { version = "1.53.3", default-features = false, features = ["rt", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
todo-keystore-secret-service.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
