[package]
name = "todo-sync"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Offline-first Sync-Engine: Segmente, Push/Pull, Scheduler, Snapshots."

[features]
default = ["zstd-native"]
# Kompression mit der C-Bibliothek zstd (nativ, schnell).
zstd-native = ["dep:zstd"]
# Reines Rust (ruzstd), z. B. für wasm32. Gleiches Datenformat (Standard-zstd-Frames).
pure-rust-zstd = ["dep:ruzstd"]

[dependencies]
todo-core.workspace = true
serde.workspace = true
serde_json.workspace = true
zstd = { version = "0.14.3", default-features = false, optional = true }
ruzstd = { version = "0.9.0", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
todo-core = { workspace = true, features = ["test-support"] }
todo-crypto.workspace = true
todo-remote-fs.workspace = true
todo-storage-sqlite.workspace = true
futures.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
