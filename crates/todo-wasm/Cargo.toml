[package]
name = "todo-wasm"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "wasm-bindgen Composition Root für die Web-App."

[dependencies]
todo-core.workspace = true
todo-crypto.workspace = true
# Kein C-zstd im Browser: reines Rust, gleiches Format.
todo-sync = { workspace = true, default-features = false, features = ["pure-rust-zstd"] }

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

# Zufallsquelle für UUIDv7-IDs im Browser (crypto.getRandomValues). Gehört in die
# Composition Root, damit todo-core frei von wasm-bindgen bleibt.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
# Dasselbe für Schlüssel und Nonces der Cipher (`todo-crypto`).
getrandom = { version = "0.4.3", features = ["wasm_js"] }
