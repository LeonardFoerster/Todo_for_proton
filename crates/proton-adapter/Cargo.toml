[package]
name = "proton-adapter"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "Proton Auth + Drive hinter den Ports AuthProvider/RemoteStore. Einziger Ort für Proton-Code."

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
async-trait.workspace = true
chrono.workspace = true
base64 = "0.22.1"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.12.1"
proton-crypto = { version = "0.14.1", default-features = false, features = ["rustpgp"] }
proton-crypto-account = { version = "0.20.1", default-features = false, features = ["rustpgp"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json", "multipart"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha1 = "0.10.7"
sha2 = "0.10.9"
todo-core.workspace = true
tokio = { version = "1.53.3", default-features = false, features = ["sync"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
futures.workspace = true
todo-core = { workspace = true, features = ["test-support"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = "0.3.23"
wiremock = "0.6.5"
