[package]
name = "todo-desktop"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Tauri-2-Shell für Linux: Composition Root (Core, SQLite, Sync, Proton) und dünne Commands."

[lib]
name = "todo_desktop"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
todo-core.workspace = true
todo-storage-sqlite.workspace = true
todo-sync = { workspace = true, features = ["zstd-native"] }
todo-crypto.workspace = true
proton-adapter.workspace = true
# Nur Debug-Builds: Verzeichnis-Backend für die Zwei-Geräte-Abnahme (`src/dev.rs`).
todo-remote-fs.workspace = true
async-trait.workspace = true
serde.workspace = true
# Tauri läuft auf tokio; hier nur Kanal, Timer und `select!` für den Sync-Scheduler.
tokio = { version = "1.53.3", default-features = false, features = ["sync", "time", "macros"] }
# Logs der Shell und der Adapter (proton-adapter loggt über `tracing`) auf stderr. Ohne Farben,
# ohne `env-filter` (regex) und ohne `log`-Brücke – Filter über `TODO_LOG` (`Targets`-Syntax).
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[target.'cfg(target_os = "linux")'.dependencies]
todo-keystore-secret-service.workspace = true
# Ordnerauswahl für „Ordner importieren…" über das XDG-Desktop-Portal. ashpd ist über oo7 (Secret
# Service) schon im Binary; nur das Feature `file_chooser` kommt dazu (serde_repr, ebenfalls schon
# da) – statt tauri-plugin-dialog + rfd (N5-11).
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "file_chooser"] }

[dev-dependencies]
tauri = { version = "2.12.4", features = ["test"] }
todo-core = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time", "test-util"] }
# TS-Typen der Shell-DTOs (Fehler, Events, Sync, Login) – nur in Tests erzeugt.
ts-rs = "12.0.1"

[lints]
workspace = true
