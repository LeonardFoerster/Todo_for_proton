[workspace]
resolver = "2"
members = ["crates/*"]
# apps/desktop/src-tauri kommt hinzu, sobald die Tauri-Shell angelegt ist.

[workspace.package]
edition = "2021"
publish = false

[workspace.dependencies]
async-trait = "0.1.92"
todo-core = { path = "crates/todo-core" }
todo-remote-fs = { path = "crates/todo-remote-fs" }
todo-storage-sqlite = { path = "crates/todo-storage-sqlite" }
todo-sync = { path = "crates/todo-sync" }
futures = { version = "0.3.34", default-features = false, features = ["executor"] }
chrono = { version = "0.4.45", default-features = false, features = ["alloc", "serde"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
proptest = "1.12.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Ausgewählte pedantic-Lints (bewusst nicht die ganze Gruppe):
cast_lossless = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
map_unwrap_or = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unused_self = "warn"
# Aus der restriction-Gruppe: keine Debug-Reste im Code.
dbg_macro = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release-wasm]
inherits = "release"
opt-level = "z"
